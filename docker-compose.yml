services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farma}
      POSTGRES_DB: ${POSTGRES_DB:-farmaexpress}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base farmaexpress_test (solo la primera vez que se crea el volumen).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: farmaexpress_api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-farma}:${POSTGRES_PASSWORD:-farma}@db:5432/${POSTGRES_DB:-farmaexpress}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tests:
    build: .
    container_name: farmaexpress_tests
    command: pytest --cov=src tests/
    environment:
      APP_ENV: testing
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-farma}:${POSTGRES_PASSWORD:-farma}@db:5432/farmaexpress_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
