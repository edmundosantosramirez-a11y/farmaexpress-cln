name: CI FarmaExpress

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farma
          POSTGRES_PASSWORD: farma
          POSTGRES_DB: farmaexpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farma -d farmaexpress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://farma:farma@localhost:5432/farmaexpress_test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit & integration tests with coverage
      run: |
        pytest --cov=src --cov-report=term-missing tests/
